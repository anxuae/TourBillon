name: Publish to PyPI

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tourbillon-app/
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install "poetry==1.8.3"

    - name: Check tag matches project version
      run: |
        TAG_VERSION="${GITHUB_REF_NAME}"
        PROJECT_VERSION="$(poetry version -s)"
        if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
          echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($PROJECT_VERSION)"
          exit 1
        fi

    - name: Install dependencies
      run: poetry install --without tests

    - name: Build frontend and bundle static assets
      run: poetry run python scripts/build-ui.py

    - name: Build package
      run: poetry build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Upload sdist/wheel as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pypi-dist
        path: dist/*
        retention-days: 7

  build-windows-exe:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install "poetry==1.8.3"

    - name: Check tag matches project version
      shell: bash
      run: |
        TAG_VERSION="${GITHUB_REF_NAME}"
        PROJECT_VERSION="$(poetry version -s)"
        if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
          echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($PROJECT_VERSION)"
          exit 1
        fi

    - name: Install dependencies
      run: poetry install --without tests --with build

    - name: Build frontend and bundle static assets
      run: poetry run python scripts/build-ui.py

    - name: Build Windows executable
      run: poetry run pyinstaller scripts/build-exe.spec --noconfirm

    - name: Rename executable
      shell: bash
      run: |
        VERSION="$(poetry version -s)"
        mv dist/tourbillon.exe "dist/tourbillon_app-${VERSION}-windows.exe"

    - name: Upload executable as artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: dist/tourbillon_app-*-windows.exe
        retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [publish-pypi, build-windows-exe]
    steps:
    - name: Download sdist/wheel artifacts
      uses: actions/download-artifact@v4
      with:
        name: pypi-dist
        path: dist

    - name: Download Windows executable artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-exe
        path: dist

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true

